    <div class="page">
      <nav class="site-nav" aria-label="Primary">
        <a href="index.html" aria-current="page">Studio</a>
        <a href="architecture.html">Architecture</a>
      </nav>

      <header class="header">
        <p class="folio">Folio I · Studio Notes</p>
        <h1 class="brand">Codex of Colour</h1>
        <p class="tagline">
          From the likeness of an image, extract the pigments — studies of 3, 5, 7, and 10 hues,
          after the manner of the old masters’ notebooks.
        </p>
        <div class="rule" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </header>

      <main>
        <form id="palette-form" class="upload-form" aria-label="Upload an image">
          <label class="file-label" for="image-input" id="drop-zone">
            <span class="file-label__mark" aria-hidden="true">❧</span>
            <span class="file-label__title">Place an image upon the desk</span>
            <span class="file-label__hint">PNG, JPG, WEBP, or GIF — drop an image here, or choose one from your files</span>
            <input
              id="image-input"
              class="file-label__input"
              name="image"
              type="file"
              accept="image/*"
              required
            />
          </label>
          <p id="file-name" class="file-name" hidden></p>
        </form>

        <section id="preview-section" class="preview-section" hidden>
          <p class="section-label">Study · Source</p>
          <figure class="preview-frame">
            <img id="preview-image" class="preview-image" alt="Uploaded image preview" />
          </figure>
        </section>

        <div id="download-all-wrap" class="download-all-wrap" hidden>
          <button type="button" id="download-all" class="ink-button">
            Download all palettes
          </button>
        </div>

        <section id="palettes" class="palettes" aria-live="polite"></section>

        <p id="status" class="status" role="status" aria-live="polite"></p>
      </main>

      <footer class="footer">
        <p>Drawn in the browser · k-means as the measuring compass</p>
        <p class="footer-credit">Made with ❤ by <a href="https://ninad.meverse.in" target="_blank" rel="noopener noreferrer">your's truly</a></p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
